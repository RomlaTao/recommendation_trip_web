<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login | Voyage Noir</title>
<!-- Google Fonts: Plus Jakarta Sans -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS v3 -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
          },
          colors: {
            luxury: {
              black: '#0A0A0A',
              darkGray: '#1A1A1A',
              lightGray: '#F5F5F5'
            }
          }
        }
      }
    }
  </script>
<style data-purpose="custom-layout">
    /* Custom style for the background image overlay to ensure high contrast */
    .hero-overlay {
      background: linear-gradient(to bottom, rgba(0,0,0,0.4), rgba(0,0,0,0.6));
    }
    /* Ensure smooth transitions for interactive elements */
    .transition-luxury {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
  </style>
</head>
<body class="bg-white font-sans text-luxury-black antialiased">
<!-- BEGIN: MainContainer -->
<main class="flex min-h-screen">
<!-- BEGIN: LeftSection - Cinematic Background -->
<section class="hidden lg:flex lg:w-1/2 relative overflow-hidden bg-black" data-purpose="branding-sidebar">
<!-- High-contrast monochrome cinematic travel photography -->
<img alt="Monochrome Cinematic Landscape" class="absolute inset-0 h-full w-full object-cover opacity-70 grayscale" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC92h4VVO4-U4VRo0uMlb9p9cMdokEYH6t0-5LLk2wCDoYdTrCBZzWZlU8r6P16FbnkVCas-zuWWhwXcBh-h4OvOwROzLUJpsTNS2VN8gK_m3YMxDu4LIy2oruCvtyINIfcljOfev55bHPbvGZuzufUfYlL4v6liUpBb09i2IAAZjvMR1cAJy076y_XcD536WWIHJ_dyvM-AtJ_UQ_Cga4OSoMSqgXOXLxvk94HSctAgI28470-FC00DJEywa8555UqdoGrlYNh-Co"/>
<!-- Overlay for depth -->
<div class="hero-overlay absolute inset-0"></div>
<!-- Centered Logo Content -->
<div class="relative z-10 flex flex-col items-center justify-center w-full h-full p-12 text-center">
<div class="border-y border-white/30 py-6 px-10" data-purpose="logo-wrapper">
<h1 class="text-white text-5xl font-light tracking-[0.3em] uppercase">
            Voyage <span class="font-bold">Noir</span>
</h1>
</div>
<p class="text-white/60 mt-8 text-sm tracking-widest uppercase font-light">The Art of Silent Travel</p>
</div>
</section>
<!-- END: LeftSection -->
<!-- BEGIN: RightSection - Login Form -->
<section class="w-full lg:w-1/2 flex items-center justify-center p-8 sm:p-12 lg:p-24 bg-white" data-purpose="login-form-container">
<div class="w-full max-w-md space-y-10">
<!-- Header -->
<header class="space-y-3">
<!-- Mobile only logo display -->
<div class="lg:hidden mb-12">
<h1 class="text-luxury-black text-2xl font-light tracking-widest uppercase border-b border-black pb-2 inline-block">
              Voyage <span class="font-bold">Noir</span>
</h1>
</div>
<h2 class="text-3xl font-semibold tracking-tight">Welcome back</h2>
<p class="text-zinc-500 font-medium">Please enter your details to sign in.</p>
</header>
<!-- BEGIN: AuthForm -->
<form action="#" class="space-y-6" data-purpose="credentials-form" method="POST">
<div class="space-y-5">
<!-- Email Field -->
<div class="space-y-2">
<label class="text-sm font-semibold uppercase tracking-wider text-zinc-400" for="email">Email Address</label>
<input autocomplete="email" class="w-full px-0 py-3 bg-transparent border-0 border-b-2 border-zinc-200 focus:ring-0 focus:border-black transition-luxury placeholder:text-zinc-300" id="email" name="email" placeholder="email@example.com" required="" type="email"/>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex items-center justify-between">
<label class="text-sm font-semibold uppercase tracking-wider text-zinc-400" for="password">Password</label>
<a class="text-xs font-bold text-black uppercase tracking-tighter hover:underline" href="#">Forgot Password?</a>
</div>
<input autocomplete="current-password" class="w-full px-0 py-3 bg-transparent border-0 border-b-2 border-zinc-200 focus:ring-0 focus:border-black transition-luxury placeholder:text-zinc-300" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Action Buttons -->
<div class="pt-4 space-y-4">
<!-- Sign In Button -->
<button class="w-full py-4 bg-luxury-black text-white text-sm font-bold uppercase tracking-[0.2em] transition-luxury hover:bg-zinc-800 active:scale-[0.98]" type="submit">
              Sign In
            </button>
<!-- Divider -->
<div class="relative py-4">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-zinc-100"></div>
</div>
<div class="relative flex justify-center text-xs uppercase tracking-widest">
<span class="bg-white px-4 text-zinc-400">Or continue with</span>
</div>
</div>
<!-- Google Sign In Button -->
<button class="w-full flex items-center justify-center gap-3 py-4 border border-zinc-200 bg-white text-sm font-bold uppercase tracking-widest transition-luxury hover:bg-zinc-50 active:scale-[0.98]" type="button">
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
              Google
            </button>
</div>
</form>
<!-- END: AuthForm -->
<!-- Footer Link -->
<footer class="text-center pt-8">
<p class="text-zinc-500 text-sm">
            Don't have an account? 
            <a class="text-black font-bold uppercase tracking-wider ml-1 hover:underline" href="#">Sign Up</a>
</p>
</footer>
</div>
</section>
<!-- END: RightSection -->
</main>
<!-- END: MainContainer -->
</body></html>
