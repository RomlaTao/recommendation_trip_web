<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sign Up | Voyage Noir</title>
<!-- Tailwind CSS v3 CDN with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Plus Jakarta Sans -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            noir: {
              DEFAULT: '#000000',
              soft: '#1A1A1A',
              muted: '#71717A'
            }
          }
        }
      }
    }
  </script>
<style data-purpose="custom-transitions">
    .transition-custom {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .auth-bg-overlay {
      background: linear-gradient(to bottom, rgba(0,0,0,0.3), rgba(0,0,0,0.7));
    }
  </style>
</head>
<body class="font-sans antialiased bg-white text-noir">
<!-- BEGIN: Main Layout -->
<main class="min-h-screen flex flex-col md:flex-row">
<!-- BEGIN: Visual Brand Section (Left Side) -->
<section class="hidden md:flex md:w-1/2 relative bg-noir items-center justify-center overflow-hidden" data-purpose="brand-visual">
<!-- Background Image -->
<img alt="Cinematic Monochrome Landscape" class="absolute inset-0 w-full h-full object-cover grayscale brightness-50" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDqivR-ImKG7YtKQ0r_AfRC_Uh5e0bghMg6eH6HOTaeP3OHLMHE-13ZoUM2WHoP-fVPjvbmULYEWsIOjvnGbWkhIlXHGYBoMREilqgjuQjdZRfVQwxHymOA1Ek6qyS-Lbw25irC6-oVHY8GRayCO0X0676W9pBaLQcr7-utA07Ij7fGteZFOi1nXW1siHXqofgPaAK_BU1tt6SHJB9PG8zmWSBelbV5ab8mC74XSGlrM0pqjY-qzCul9Qn1R_O3M6vfZiq5ZSxtJlI"/>
<!-- Gradient Overlay for readability -->
<div class="absolute inset-0 auth-bg-overlay"></div>
<!-- Logo Branding -->
<div class="relative z-10 text-center px-8" data-purpose="centered-logo">
<h1 class="text-white text-5xl font-light tracking-[0.2em] uppercase mb-2">Voyage Noir</h1>
<p class="text-gray-300 tracking-widest text-sm uppercase">Curated Journeys in Monochrome</p>
</div>
</section>
<!-- END: Visual Brand Section -->
<!-- BEGIN: Form Section (Right Side) -->
<section class="flex-1 flex items-center justify-center p-8 md:p-16 lg:p-24 bg-white" data-purpose="signup-form-container">
<div class="w-full max-w-md space-y-8">
<!-- Header Mobile Logo & Text -->
<div class="space-y-2">
<h2 class="md:hidden text-2xl font-light tracking-widest uppercase mb-8">Voyage Noir</h2>
<h3 class="text-3xl font-semibold tracking-tight">Create an account</h3>
<p class="text-noir-muted">Start your journey into the extraordinary.</p>
</div>
<!-- BEGIN: Signup Form -->
<form action="#" class="space-y-5" data-purpose="registration-form" method="POST">
<!-- Full Name Field -->
<div class="space-y-1">
<label class="block text-xs font-bold uppercase tracking-wider text-noir-muted" for="full-name">Full Name</label>
<input class="w-full px-0 py-3 border-0 border-b border-gray-200 focus:ring-0 focus:border-noir transition-custom placeholder:text-gray-300" id="full-name" name="full-name" placeholder="John Doe" required="" type="text"/>
</div>
<!-- Email Field -->
<div class="space-y-1">
<label class="block text-xs font-bold uppercase tracking-wider text-noir-muted" for="email">Email Address</label>
<input class="w-full px-0 py-3 border-0 border-b border-gray-200 focus:ring-0 focus:border-noir transition-custom placeholder:text-gray-300" id="email" name="email" placeholder="name@example.com" required="" type="email"/>
</div>
<!-- Password Field -->
<div class="space-y-1">
<label class="block text-xs font-bold uppercase tracking-wider text-noir-muted" for="password">Password</label>
<input class="w-full px-0 py-3 border-0 border-b border-gray-200 focus:ring-0 focus:border-noir transition-custom placeholder:text-gray-300" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
<!-- Confirm Password Field -->
<div class="space-y-1">
<label class="block text-xs font-bold uppercase tracking-wider text-noir-muted" for="confirm-password">Confirm Password</label>
<input class="w-full px-0 py-3 border-0 border-b border-gray-200 focus:ring-0 focus:border-noir transition-custom placeholder:text-gray-300" id="confirm-password" name="confirm-password" placeholder="••••••••" required="" type="password"/>
</div>
<!-- Action Buttons -->
<div class="pt-4 space-y-4">
<button class="w-full bg-noir text-white py-4 px-6 rounded-none font-medium hover:bg-gray-800 transition-custom uppercase tracking-widest text-sm" data-purpose="submit-button" type="submit">
              Create Account
            </button>
<div class="relative py-2">
<div class="absolute inset-0 flex items-center"><span class="w-full border-t border-gray-100"></span></div>
<div class="relative flex justify-center text-xs uppercase"><span class="bg-white px-2 text-noir-muted tracking-widest">Or</span></div>
</div>
<!-- Social Auth -->
<button class="w-full flex items-center justify-center gap-3 bg-white border border-gray-200 py-4 px-6 rounded-none font-medium hover:bg-gray-50 transition-custom text-sm uppercase tracking-widest" data-purpose="google-auth-button" type="button">
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
              Continue with Google
            </button>
</div>
</form>
<!-- END: Signup Form -->
<!-- Footer Link -->
<p class="text-center text-sm text-noir-muted pt-4">
          Already have an account? 
          <a class="text-noir font-semibold hover:underline underline-offset-4 ml-1" href="#">Sign In</a>
</p>
</div>
</section>
<!-- END: Form Section -->
</main>
<!-- END: Main Layout -->
</body></html>
